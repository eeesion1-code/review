<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Google クチコミ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=Yuji+Syuku&family=Zen+Antique&family=Dela+Gothic+One&family=Zen+Old+Mincho:wght@600&display=swap">
<style>
/* 版式：一屏竖排 —— 店名 / 炉縁框里的感谢语 / 写评价按钮 / 桌号。和桌上的 QR 卡同一套「いろり」配色（只做一种深色样式） */
:root {
  --sumi: #1c1814; --washi: #efe6d3; --ash: #a89d8c; --kuri: #7b5636; --kuri-d: #4f3622; --hi: #c96a34;
  --f-mincho: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-gothic: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; }
html, body { min-height: 100%; background: var(--sumi); color: var(--washi); }
body { font-family: var(--f-gothic); -webkit-text-size-adjust: 100%;
  padding: max(28px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(22px, env(safe-area-inset-left));
  background: radial-gradient(120% 60% at 50% 38%, rgba(201,106,52,.16), rgba(201,106,52,0) 60%), var(--sumi); }
main { max-width: 420px; margin: 0 auto; display: grid; gap: 28px; }
.head { display: flex; align-items: center; gap: 10px; font-size: 13px; letter-spacing: .16em; color: var(--ash); }
.head i { width: 7px; height: 7px; border-radius: 50%; background: var(--hi); flex: none; }
.head b { font-weight: 400; white-space: nowrap; }
.head span { flex: 1; height: 1px; background: linear-gradient(90deg, var(--kuri), transparent); }
.ro { background: var(--kuri); padding: 10px; box-shadow: inset 0 0 0 1px var(--kuri-d), inset 0 0 0 4px var(--kuri), inset 0 0 0 5px var(--kuri-d); }
.ro div { background: rgba(28,24,20,.92); padding: 30px 18px 26px; text-align: center; display: grid; gap: 14px; }
h1 { font-family: var(--f-mincho); font-weight: 700; font-size: clamp(19px, 6.2vw, 25px); line-height: 1.6; letter-spacing: .05em; }
h1 span, .ro p span { white-space: nowrap; }
.ro p { font-family: var(--f-mincho); font-size: clamp(14px, 4.2vw, 16px); line-height: 1.9; letter-spacing: .06em; color: var(--washi); }
.go { display: block; text-align: center; text-decoration: none; background: var(--washi); color: var(--sumi);
  font-family: var(--f-mincho); font-weight: 700; font-size: 19px; letter-spacing: .08em; padding: 19px 12px; border-radius: 4px;
  box-shadow: 0 0 0 1px var(--kuri), 0 10px 30px rgba(0,0,0,.35); }
.go:active { transform: translateY(1px); }
.go:focus-visible { outline: 2px solid var(--hi); outline-offset: 3px; }
.note { text-align: center; font-size: 12.5px; line-height: 1.8; color: var(--ash); letter-spacing: .04em; }
/* v10（用户 11/18：两个按钮并排让客人自己选）*/
.pick { display: grid; gap: 14px; }
.pick .ask { text-align: center; font-family: var(--f-mincho); font-size: 15px; letter-spacing: .1em; color: var(--washi); }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.opt { display: grid; gap: 9px; align-content: start; }
.pick .go { display: grid; align-content: center; gap: 1px; min-height: 104px; padding: 12px 6px; font-size: 16px; letter-spacing: .03em; }
.pick .go b { font-weight: 700; white-space: nowrap; }
.pick .go small { font-size: 12.5px; font-weight: 500; color: #6b5a47; letter-spacing: .08em; margin-top: 3px; }
.pick .sub { text-align: center; font-size: 11.5px; line-height: 1.7; color: var(--ash); }
.pick .sub b { color: var(--washi); font-weight: 600; font-size: 11px; white-space: nowrap; }
.note.hint { font-size: 11.5px; line-height: 1.7; opacity: .85; }
.note b { color: var(--washi); font-weight: 600; }
.note .nw { white-space: nowrap; }
.note .mp { display: inline-block; margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(239,230,211,.14); }
/* 第二条路：没装 Chrome 时用。点了大按钮 3 秒还在本页（没打开 Chrome）就亮起来 */
.alt { display: grid; gap: 14px; border: 1px solid rgba(239,230,211,.14); border-radius: 6px; padding: 16px 14px 18px; transition: border-color .4s, background .4s; }
.alt.hot { border-color: var(--hi); background: rgba(201,106,52,.10); }
.alt .cap { text-align: center; font-size: 13px; color: var(--ash); letter-spacing: .06em; }
.alt.hot .cap { color: var(--washi); font-weight: 600; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.go2 { display: block; text-align: center; text-decoration: none; color: var(--washi); border: 1px solid var(--kuri); border-radius: 4px;
  font-family: var(--f-mincho); padding: 11px 6px 10px; background: rgba(123,86,54,.18); display: grid; gap: 2px; }
.go2 b { font-weight: 700; font-size: 15px; letter-spacing: .03em; white-space: nowrap; }
.go2 small { font-size: 12px; color: var(--ash); letter-spacing: .04em; white-space: nowrap; }
.go2:active { transform: translateY(1px); }
.go2:focus-visible { outline: 2px solid var(--hi); outline-offset: 3px; }
/* 两步图示：模仿 Google マップ App 里的「クチコミ」标签和「クチコミを書く」按钮 */
.steps { display: grid; gap: 12px; padding-top: 4px; border-top: 1px dashed rgba(239,230,211,.12); }
.steps .cap { text-align: center; font-size: 12.5px; color: var(--ash); letter-spacing: .06em; }
.steps .row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.steps .st { display: grid; justify-items: center; gap: 7px; text-align: center; }
.steps .n { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--kuri); color: var(--washi); font-size: 11px; display: grid; place-items: center; }
.steps .chip { display: inline-flex; align-items: center; gap: 5px; background: #fff; color: #1a1a1a; font-family: -apple-system, "Hiragino Sans", sans-serif;
  font-size: 13.5px; font-weight: 600; padding: 7px 13px; border-radius: 99px; white-space: nowrap; border-bottom: 2px solid #1a73e8; }
.steps .chip.pen { border: 1px solid #c7d7f2; background: #e8f0fe; color: #0b57d0; }
.steps .t { font-size: 12px; color: var(--ash); }
.steps .ar { color: var(--kuri); font-size: 18px; }
.foot { display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid rgba(239,230,211,.16); padding-top: 14px; }
.foot small { font-size: 10.5px; letter-spacing: .2em; color: var(--ash); line-height: 1.6; }
.foot .tk { font-family: var(--f-mincho); font-weight: 700; display: flex; align-items: baseline; gap: 6px; }
.foot .tk em { font-style: normal; font-size: 30px; }
.foot .tk span { font-size: 14px; color: var(--ash); }
body { min-height: 100vh; }
html:has(body.t2) { background: #f2ece0; } html:has(body.t3) { background: #f6f3ec; }
html:has(body.t4) { background: #4a2e1b; } html:has(body.t5) { background: #f7f6f2; }
.foot { justify-content: center; align-items: center; min-height: 64px; }
.foot .stamp { display: none; }

/* ===== 5 种风格（11/18，和 QR 卡同名同配色）：body.t1〜t5 ===== */
/* 2 和紙・墨 */
body.t2 { color-scheme: light; color: #211c17; background:
  radial-gradient(ellipse 70% 40% at 20% 10%, rgba(140,110,70,.08), transparent 70%),
  radial-gradient(ellipse 60% 40% at 85% 90%, rgba(140,110,70,.09), transparent 70%),
  repeating-linear-gradient(115deg, rgba(120,95,60,0) 0 6px, rgba(120,95,60,.035) 6px 7px), #f2ece0; }
.t2 .head b { color: #211c17; font-family: var(--f-mincho); letter-spacing: .22em; } .t2 .head i { background: #b8392a; border-radius: 1px; }
.t2 .head span { background: linear-gradient(90deg, rgba(33,28,23,.5), transparent); }
.t2 .ro { background: transparent; padding: 8px; box-shadow: inset 0 0 0 2px #211c17, inset 0 0 0 6px #f2ece0, inset 0 0 0 7px #211c17; }
.t2 .ro div { background: transparent; }
.t2 h1 { font-family: "Yuji Syuku", var(--f-mincho); font-weight: 400; color: #211c17; }
.t2 .ro p, .t2 .pick .ask { color: #211c17; }
.t2 .go { background: #211c17; color: #f2ece0; box-shadow: none; } .t2 .pick .go small { color: #cfc4b2; }
.t2 .pick .sub { color: #7a6f62; } .t2 .pick .sub b { color: #211c17; }
.t2 .foot { border-top-color: rgba(33,28,23,.2); justify-content: space-between; }
.t2 .foot .stamp { display: grid; place-items: center; width: 48px; height: 48px; background: #b8392a; color: #f7efe2; border-radius: 4px;
  font-family: var(--f-mincho); font-weight: 700; font-size: 12px; writing-mode: vertical-rl; transform: rotate(-5deg);
  box-shadow: inset 0 0 0 2px #f2ece0, inset 0 0 0 3px #b8392a; }
.t2 .foot .tk em { color: #211c17; font-family: "Yuji Syuku", var(--f-mincho); font-weight: 400; } .t2 .foot .tk span { color: #7a6f62; }

/* 3 暖簾 */
body.t3 { color-scheme: light; background: #f6f3ec; color: #1f3352; padding-top: 0; }
.t3 .head { margin: 0 -22px; padding: calc(max(28px, env(safe-area-inset-top)) + 10px) 22px 50px; background: #1f3352; justify-content: center; position: relative; }
.t3 .head::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30px;
  background: linear-gradient(90deg, transparent calc(33.33% - 2px), #f6f3ec calc(33.33% - 2px) calc(33.33% + 2px), transparent calc(33.33% + 2px) calc(66.66% - 2px), #f6f3ec calc(66.66% - 2px) calc(66.66% + 2px), transparent calc(66.66% + 2px)); }
.t3 .head i, .t3 .head span { display: none; }
.t3 .head b { color: #f6f3ec; font-family: var(--f-mincho); font-weight: 700; font-size: 18px; letter-spacing: .2em; }
.t3 .ro { background: transparent; padding: 0; box-shadow: inset 0 0 0 1px #1f3352; } .t3 .ro div { background: #fff; margin: 1px; }
.t3 h1, .t3 .ro p, .t3 .pick .ask { color: #1f3352; }
.t3 .go { background: #1f3352; color: #f6f3ec; box-shadow: none; } .t3 .pick .go small { color: #b9c3d3; }
.t3 .pick .sub { color: #6c7a8f; } .t3 .pick .sub b { color: #1f3352; }
.t3 .foot { border-top-color: rgba(31,51,82,.18); }
.t3 .foot .tk { align-items: center; } .t3 .foot .tk em { color: #1f3352; font-size: 22px; min-width: 48px; height: 48px; padding: 0 8px; border: 2px solid #1f3352; border-radius: 99px; display: grid; place-items: center; }
.t3 .foot .tk span { color: #6c7a8f; }

/* 4 炉端・木目 */
body.t4 { color: #f1e7d2; background:
  radial-gradient(ellipse 90% 45% at 50% 30%, rgba(255,220,160,.10), transparent 70%),
  repeating-linear-gradient(91deg, #4f321e 0 10px, #472c1a 10px 16px, #55361f 16px 28px, #4a2e1b 28px 32px); }
.t4 main { outline: 1px solid rgba(201,164,92,.6); outline-offset: 10px; }
.t4 .head i { background: #c9a45c; } .t4 .head b { color: #e6d3ad; } .t4 .head span { background: linear-gradient(90deg, #c9a45c, transparent); }
.t4 .ro { background: #c9a45c; padding: 2px; box-shadow: 0 8px 22px rgba(0,0,0,.4); } .t4 .ro div { background: rgba(42,26,15,.9); }
.t4 .go { background: #f1e7d2; color: #2a1a0f; box-shadow: 0 0 0 2px #c9a45c, 0 8px 20px rgba(0,0,0,.35); } .t4 .pick .go small { color: #6b4a2b; }
.t4 .pick .sub { color: #d9c6a3; }
.t4 .foot { border-top-color: rgba(201,164,92,.35); }
.t4 .foot .tk { background: #f1e7d2; padding: 6px 20px 7px; border-radius: 3px; box-shadow: 0 0 0 2px #c9a45c; }
.t4 .foot .tk em { color: #2a1a0f; font-size: 24px; } .t4 .foot .tk span { color: #6b4a2b; }

/* 5 余白・モダン */
body.t5 { color-scheme: light; background: #f7f6f2; color: #1d1d1b; }
body.t5::before { content: "囲"; position: fixed; right: -40px; bottom: 30px; font-family: var(--f-mincho); font-size: 260px; line-height: 1; color: rgba(29,29,27,.035); pointer-events: none; }
.t5 .head i { background: #c96a34; border-radius: 0; width: 6px; height: 6px; } .t5 .head b { color: #1d1d1b; letter-spacing: .3em; font-size: 12px; }
.t5 .head span { background: rgba(29,29,27,.18); }
.t5 .ro { background: none; box-shadow: none; padding: 0; } .t5 .ro div { background: none; padding: 26px 0 8px; }
.t5 h1 { font-weight: 500; color: #1d1d1b; } .t5 .ro p, .t5 .pick .ask { color: #1d1d1b; }
.t5 .go { background: #1d1d1b; color: #f7f6f2; border-radius: 0; box-shadow: none; } .t5 .pick .go small { color: #b9b6ae; }
.t5 .pick .sub { color: #8a8780; } .t5 .pick .sub b { color: #1d1d1b; }
.t5 .foot { border-top-color: rgba(29,29,27,.15); justify-content: flex-end; }
.t5 .foot .tk em { color: #1d1d1b; font-weight: 500; } .t5 .foot .tk span { color: #8a8780; }

/* ===== 第二批 5 种（frontend-design 思路）：body.t6〜t10 ===== */
html:has(body.t6) { background: #efe4cc; } html:has(body.t7) { background: #160605; } html:has(body.t8) { background: #f4e2b8; }
html:has(body.t9) { background: #0f0f0f; } html:has(body.t10) { background: #f3efe8; }
/* 6 浮世絵 */
body.t6 { color-scheme: light; background: #efe4cc; color: #1e2f55; padding-top: calc(max(28px, env(safe-area-inset-top)) + 26px); padding-bottom: 60px; }
body.t6::before, body.t6::after { content: ""; position: fixed; left: 0; right: 0; height: 26px; pointer-events: none;
  background: radial-gradient(circle at 50% 100%, transparent 5px, #1e2f55 5px 6.5px, transparent 6.5px 9px, #1e2f55 9px 10.5px, transparent 10.5px 12.5px, #1e2f55 12.5px) 0 0 / 26px 13px repeat; }
body.t6::before { top: 0; } body.t6::after { bottom: 0; }
.t6 .head b { color: #1e2f55; font-family: "Zen Antique", serif; letter-spacing: .2em; } .t6 .head i { background: #c0392b; }
.t6 .head span { background: linear-gradient(90deg, rgba(30,47,85,.5), transparent); }
.t6 .ro { background: #1e2f55; padding: 4px; box-shadow: none; } .t6 .ro div { background: #fbf6ea; }
.t6 h1 { font-family: "Zen Antique", serif; font-weight: 400; color: #1e2f55; } .t6 .ro p, .t6 .pick .ask { color: #1e2f55; }
.t6 .go { background: #1e2f55; color: #fbf6ea; box-shadow: none; border-radius: 2px; } .t6 .pick .go small { color: #c9b48f; }
.t6 .pick .sub { color: #8a6d4b; } .t6 .pick .sub b { color: #1e2f55; }
.t6 .foot { border-top-color: rgba(30,47,85,.3); } .t6 .foot .tk em { color: #c0392b; font-family: "Zen Antique", serif; font-weight: 400; } .t6 .foot .tk span { color: #1e2f55; }
/* 7 提灯 */
body.t7 { color: #f6e7c8; background: radial-gradient(ellipse 90% 45% at 50% 28%, #74200f 0%, #2a0b08 60%, #160605 100%); }
body.t7::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 14px, rgba(0,0,0,.18) 14px 15px); }
.t7 .head i { background: #f2b25c; } .t7 .head b { color: #f6e7c8; font-family: var(--f-mincho); } .t7 .head span { background: linear-gradient(90deg, #f2b25c, transparent); }
.t7 .ro { background: #f2b25c; padding: 2px; border-radius: 16px; box-shadow: 0 0 46px rgba(255,150,70,.4); } .t7 .ro div { background: rgba(42,11,8,.94); border-radius: 14px; }
.t7 h1, .t7 .ro p, .t7 .pick .ask { color: #f6e7c8; }
.t7 .go { background: #f6e7c8; color: #2a0b08; border-radius: 16px; box-shadow: 0 0 26px rgba(255,150,70,.35); } .t7 .pick .go small { color: #8a4a2a; }
.t7 .pick .sub { color: #e0b98a; } .t7 .pick .sub b { color: #f6e7c8; }
.t7 .foot { border-top-color: rgba(246,231,200,.2); } .t7 .foot .tk em { color: #f2b25c; } .t7 .foot .tk span { color: #e0b98a; }
/* 8 昭和レトロ */
body.t8 { color-scheme: light; background: #f4e2b8; color: #2b1d14; }
.t8 main { border: 5px solid #c8321e; border-radius: 16px; padding: 16px 14px 18px; gap: 24px; }
.t8 .head { background: #c8321e; border-radius: 9px; padding: 11px; justify-content: center; } .t8 .head i, .t8 .head span { display: none; }
.t8 .head b { font-family: "Dela Gothic One", sans-serif; color: #f4e2b8; font-size: 16px; letter-spacing: .06em; }
.t8 .ro { background: #2b1d14; padding: 4px; border-radius: 12px; box-shadow: none; } .t8 .ro div { background: #fffaf0; border-radius: 9px; }
.t8 h1 { font-family: "Dela Gothic One", sans-serif; font-weight: 400; color: #2b1d14; } .t8 .ro p { color: #2b1d14; }
.t8 .pick .ask { font-family: "Dela Gothic One", sans-serif; color: #c8321e; letter-spacing: .04em; }
.t8 .go { background: #c8321e; color: #fff7e6; border-radius: 14px; box-shadow: 0 5px 0 #2b1d14; } .t8 .pick .go b { font-family: "Dela Gothic One", sans-serif; font-weight: 400; }
.t8 .pick .go small { color: #f4d9a8; } .t8 .pick .sub { color: #6b4a2b; } .t8 .pick .sub b { color: #2b1d14; }
.t8 .foot { border-top: 2px dashed rgba(43,29,20,.45); }
.t8 .foot .tk { align-items: center; } .t8 .foot .tk em { font-family: "Dela Gothic One", sans-serif; color: #f4e2b8; background: #2b1d14; padding: 2px 16px; border-radius: 99px; font-size: 26px; }
.t8 .foot .tk span { color: #2b1d14; font-weight: 700; }
/* 9 市松・金 */
body.t9 { color: #e9d9a6; background: conic-gradient(#191919 25%, #0f0f0f 0 50%, #191919 0 75%, #0f0f0f 0) 0 0 / 26px 26px; }
.t9 main { background: #0f0f0f; padding: 22px 18px; box-shadow: 0 0 0 1px #c9a75a, 0 0 0 5px #0f0f0f, 0 0 0 6px #c9a75a; }
.t9 .head i { background: #c9a75a; transform: rotate(45deg); border-radius: 0; } .t9 .head b { color: #e9d9a6; font-family: "Zen Old Mincho", serif; } .t9 .head span { background: linear-gradient(90deg, #c9a75a, transparent); }
.t9 .ro { background: linear-gradient(135deg, #f1e1b0, #a8823e 40%, #f1e1b0 60%, #9c7634); padding: 2px; box-shadow: none; } .t9 .ro div { background: #121212; }
.t9 h1 { font-family: "Zen Old Mincho", serif; background: linear-gradient(90deg, #f1e1b0, #c9a75a); -webkit-background-clip: text; background-clip: text; color: transparent; }
.t9 .ro p, .t9 .pick .ask { color: #e9d9a6; }
.t9 .go { background: #121212; color: #e9d39a; box-shadow: inset 0 0 0 1px #c9a75a; } .t9 .pick .go small { color: #a89a72; }
.t9 .pick .sub { color: #a89a72; } .t9 .pick .sub b { color: #e9d9a6; }
.t9 .foot { border-top-color: rgba(201,167,90,.35); } .t9 .foot .tk em { color: #e9d39a; font-family: "Zen Old Mincho", serif; } .t9 .foot .tk span { color: #a89a72; }
/* 10 炭火エディトリアル */
body.t10 { color-scheme: light; background: #f3efe8; color: #151311; padding-left: max(30px, env(safe-area-inset-left)); }
body.t10::before { content: ""; position: fixed; left: 0; top: 0; bottom: 0; width: 9px; background: #e04a2a; }
.t10 .head i { background: #e04a2a; border-radius: 0; } .t10 .head b { font-family: "Dela Gothic One", sans-serif; color: #151311; letter-spacing: .06em; }
.t10 .head span { background: #151311; height: 3px; }
.t10 .ro { background: none; box-shadow: none; padding: 0; } .t10 .ro div { background: none; text-align: left; padding: 6px 0; }
.t10 h1 { font-family: "Dela Gothic One", sans-serif; font-weight: 400; font-size: clamp(20px, 7vw, 28px); line-height: 1.4; color: #151311; }
.t10 .ro p { color: #151311; } .t10 .pick .ask { color: #151311; font-family: "Dela Gothic One", sans-serif; text-align: left; letter-spacing: .04em; }
.t10 .go { background: #151311; color: #f3efe8; border-radius: 0; box-shadow: 5px 5px 0 #e04a2a; } .t10 .pick .go small { color: #f08a6e; }
.t10 .pick .sub { color: #6d6760; } .t10 .pick .sub b { color: #151311; }
.t10 .foot { border-top: 6px solid #151311; justify-content: flex-start; } .t10 .foot .tk em { font-family: "Dela Gothic One", sans-serif; color: #e04a2a; font-size: 34px; } .t10 .foot .tk span { color: #151311; font-weight: 700; }

.bad { text-align: center; font-family: var(--f-mincho); font-size: 17px; line-height: 1.9; padding-top: 30vh; }
</style>
</head>
<body>
<main id="app">
  <div class="head"><i></i><b id="shop">&nbsp;</b><span></span></div>
  <div class="ro"><div>
    <h1><span>本日はご来店</span><br><span>ありがとうございました</span></h1>
    <p><span>よろしければ、Google クチコミに</span><br><span>ご感想をお寄せください</span></p>
  </div></div>
  <section class="pick">
    <p class="ask">お使いのアプリを選んでください</p>
    <div class="pair">
      <div class="opt">
        <a class="go" id="gmap" href="#" rel="noopener"><b>Google マップ</b><small>で書く</small></a>
        <p class="sub">開いたら <b>「クチコミ」</b>→<br><b>「クチコミを書く」</b>をタップ</p>
      </div>
      <div class="opt">
        <a class="go" id="go" href="#" rel="noopener"><b>Google アプリ</b><b>Chrome</b><small>で書く</small></a>
        <p class="sub">クチコミ投稿画面が<br>そのまま開きます</p>
      </div>
    </div>
  </section>
  <div class="foot"><span class="stamp">いろり屋</span><div class="tk" id="tk"></div></div>
</main>
<script>
/* 店铺：s=店铺代码 → 店名＋Google 官方「クチコミを依頼」链接（加新店在这里加一行，同时在 APP 的店铺设置里加） */
var STORES = {
  omiya: { name: "権兵衛のいろり屋 大宮店", review: "https://g.page/r/CWrQLL72jFOREAE/review",
           map: "https://www.google.com/maps?cid=10471868549946986602",   // Google マップ上の店舗ページ（見るだけならログイン不要）
           app: "comgooglemapsurl://maps.google.com/?cid=10471868549946986602" }   // app＝Google マップ App で店舗ページを開く（店舗番号で開くので別の店にならない。11/17 LINE で実測 OK）
};
/* 扫码记录：发给 APP（Apps Script），不等回应、不影响页面 */
var LOG = "https://script.google.com/macros/s/AKfycbzsjsanQpjfDDHI3n2qdwbZwZneBUK6KTa3pA5SrNubG2pMtSqWYTQ-8BsHITGA8RqS/exec";
var KANJI = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十", "十一", "十二", "十三", "十四", "十五", "十六", "十七", "十八", "十九", "二十"];

(function () {
  var q = new URLSearchParams(location.search), s = (q.get("s") || "").trim(), t = (q.get("t") || "").trim().slice(0, 20);
  /* 风格：THEME＝正式用的版本；网址加 &theme=1〜5 只是预览（预览不记扫码） */
  var THEME = 1, qt = q.get("theme"), preview = /^([1-9]|10)$/.test(qt || "");
  document.body.classList.add("t" + (preview ? qt : THEME));
  var st = STORES[s];
  if (!st) {
    document.getElementById("app").innerHTML = '<p class="bad">QR コードを読み取れませんでした。<br>恐れ入りますが、スタッフにお声がけください。</p>';
    return;
  }
  document.title = st.name + " | Google クチコミ";
  document.getElementById("shop").textContent = st.name;
  /* 写评价要登录 Google。扫码软件自带的浏览器（LINE、Google App 等）没有登录，也不会把链接交给 App →
     iPhone：内置浏览器里直接叫起 Google マップ App（comgooglemaps://，App 里已登录），1.8 秒没离开页面（没装 App）才去网页版；
             Safari 里用官方评价链接（有 App 时 iOS 会交给 App 直接开评价框）。
     Android：intent 指定 Google マップ App 打开官方评价链接，没装 App 自动用浏览器。 */
  var ua = navigator.userAgent, iOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/.test(ua);
  /* v3（用户 11/17：跳到登录页不行，跳到地图更好）→ 按钮一律去 Google マップ上的店铺页面（看页面不用登录；
     有 App 就用 App 开，App 里已登录可以直接写）。登录只在客人自己点「クチコミを書く」时才可能出现。 */
  /* v4（11/17 在用户 iPhone 上实测）：App 不接受「直接打开写评价画面」的跳转（comgooglemapsurl:// 的 g.page / writereview 都没反应，
     place_id 搜不到；带 !9m1!1b1 的「クチコミ」标签页链接只开空白地点；Chrome / Google App 也不行），Safari 里的 g.page / writereview 也只会进登录页
     → iPhone 一律叫起 App 打开店铺页面（comgooglemapsurl://maps.google.com/?cid=店铺编号，LINE 里实测能打开），
     再用两步图示告诉客人点「クチコミ」→「クチコミを書く」。 */
  /* v6（用户 11/17 在 LINE 实测：用 Chrome〔googlechromes://〕和 Google App〔googleapp://open-url〕打开官方评价链接，
     能直接进写评价画面，因为那两个 App 里已登录 Google）。网页查不到客人装了哪些 App →
     大按钮先用 Chrome；点了 3 秒还在本页（没装 Chrome，或在 LINE 的提示里点了「許可しない」）就把下面「開かない場合」亮起来，
     给 Google App（同样直接写）和 Google マップ App（店铺页＋两步图示，几乎人人都有）两条路。不自动连跳，免得 LINE 连续弹提示。
     Android：Chrome 打开评价链接（intent，没装就用浏览器）。 */
  /* v8（用户 11/18：按钮太多，合成一个；地图先不管）：一个按钮，依次自动试
     ① Chrome（googlechromes://）→ ② Google App（googleapp://open-url）→ ③ 本浏览器打开评价链接（没登录 Google 的会出登录页，绕不过）。
     每步等 3.5 秒（给客人在 LINE 的「外部アプリ」提示里点「許可する」的时间）；页面一离开（App 打开了）就停，回来也不再接着跳。 */
  var go = document.getElementById("go"), gmap = document.getElementById("gmap");
  var bare = st.review.replace(/^https:\/\//, "");
  go.href = st.review;
  /* v7：已经在 Chrome / Google App 里打开的（那两个 App 里已登录 Google），直接在原地打开评价链接 */
  var env = /Line\//.test(ua) ? "line" : /GSA\//.test(ua) ? "googleapp" : /CriOS/.test(ua) ? "chrome"
    : /FxiOS|EdgiOS|OPiOS|YJApp|PayPay|Instagram|FBAN|FBAV|MicroMessenger/i.test(ua) ? "other"
    : android ? (/; wv\)/.test(ua) ? "android-app" : "android") : iOS ? (/Safari\//.test(ua) ? "safari" : "inapp") : "pc";
  window.__env = env;
  var steps = [st.review];   // 已在 Chrome / Google App 里（已登录）、电脑：原地打开
  if (iOS && env !== "chrome" && env !== "googleapp") {
    // v10（用户 11/18：连续弹窗客人会觉得奇怪 → 地图拆成右边单独的按钮，左边接力只试 Chrome → Google App）
    steps = ["googlechromes://" + bare, "googleapp://open-url?url=" + encodeURIComponent(st.review), st.review];
  } else if (android) {   // Android：intent 指定 Chrome（Android 的 Chrome 一般已登录），没装就用浏览器
    steps = ["intent://" + bare + "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(st.review) + ";end"];
  }
  // 右边「Google マップ」：iPhone 叫起地图 App（只弹一次），没装就开网页版地图；Android 用 intent 指定地图 App
  gmap.href = iOS ? st.app : android
    ? "intent://" + st.map.replace(/^https:\/\//, "") + "#Intent;scheme=https;package=com.google.android.apps.maps;S.browser_fallback_url=" + encodeURIComponent(st.map) + ";end"
    : st.map;
  if (iOS) gmap.addEventListener("click", function () {
    setTimeout(function () { if (!document.hidden && !left) location.href = st.map; }, 3500);
  });
  go.href = steps[0];
  var left = false;
  var mark = function () { if (document.hidden) left = true; };
  document.addEventListener("visibilitychange", mark);
  window.addEventListener("pagehide", function () { left = true; });
  go.addEventListener("click", function (e) {
    if (steps.length < 2) return;   // 只有一步：照常打开链接
    e.preventDefault();
    left = false;
    var i = 0;
    (function next() {
      if (left || i >= steps.length) return;   // App 已经打开（页面离开过）就停
      location.href = steps[i++];
      if (i < steps.length) setTimeout(next, 3500);
    })();
  });
  var n = /^\d+$/.test(t) ? parseInt(t, 10) : null;
  if (t) {
    var tk = document.getElementById("tk");
    var em = document.createElement("em"); em.textContent = n !== null && KANJI[n] ? KANJI[n] : t;
    var sp = document.createElement("span"); sp.textContent = "番卓";
    tk.appendChild(em); tk.appendChild(sp);
  }
  var url = LOG + "?log=1&s=" + encodeURIComponent(s) + "&t=" + encodeURIComponent(t) + "&ua=" + encodeURIComponent(window.__env || "") + "&_=" + Date.now();
  if (!preview) {
    try { fetch(url, { mode: "no-cors", keepalive: true, cache: "no-store" }).catch(function () { new Image().src = url; }); }
    catch (e) { new Image().src = url; }
  }
})();
</script>
</body>
</html>
